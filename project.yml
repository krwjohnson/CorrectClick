name: CorrectClick

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

options:
  bundleIdPrefix: com.correctclick
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: "T4Q97VH6ST"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Local/dev default. Release builds (scripts/build_dmg.sh, CI) override
    # these via `xcodebuild ... MARKETING_VERSION=X CURRENT_PROJECT_VERSION=X`,
    # sourced from the VERSION file at the repo root.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  CorrectClick:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: CorrectClick
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correctclick.CorrectClick
        INFOPLIST_FILE: CorrectClick/Info.plist
        CODE_SIGN_ENTITLEMENTS: CorrectClick/CorrectClick.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CorrectClickExtension
        embed: true
        buildPhase: copyFiles
        copy:
          destination: plugins
      - package: Sparkle
    postBuildScripts:
      - name: Bundle Uninstaller
        script: |
          # Ships scripts/uninstall.sh inside the app as a Resource so it stays
          # available on disk after the install DMG is thrown away. Renamed to
          # .command so Terminal executes it on double-click / NSWorkspace.open.
          DEST="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Resources/Uninstall CorrectClick.command"
          mkdir -p "$(dirname "$DEST")"
          cp "${SRCROOT}/scripts/uninstall.sh" "$DEST"
          chmod +x "$DEST"

  CorrectClickExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: CorrectClickExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correctclick.CorrectClick.FinderSyncExtension
        INFOPLIST_FILE: CorrectClickExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CorrectClickExtension/CorrectClickExtension.entitlements
    postBuildScripts:
      - name: Enable Extension
        script: |
          # macOS registers each new build as a new plugin instance and leaves it
          # in pending-approval state. Force-enable it so Finder picks it up immediately.
          BUNDLE_ID=$(defaults read "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Info" CFBundleIdentifier 2>/dev/null)
          if [ -n "$BUNDLE_ID" ]; then
            pluginkit -e use -i "$BUNDLE_ID" || true
          fi

  CorrectClickTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: CorrectClickTests
      - path: Shared
      # Pulled in directly (not @testable import) so tests can run as a
      # standalone bundle with no host application — FileCreator.swift only
      # needs Cocoa for AppKit-side effects (Finder reveal, keystroke) that
      # the tests below never touch, just the pure `uniqueURL` naming logic.
      - path: CorrectClickExtension/FileCreator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correctclick.CorrectClickTests
        GENERATE_INFOPLIST_FILE: YES
