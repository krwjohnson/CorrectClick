name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The VERSION file is the source of truth — this workflow releases
      # exactly what it says, never bumps it. To release, run
      # scripts/set_version.sh X.Y.Z, update RELEASE_NOTES.md, and push. A
      # push whose VERSION already has a tag (docs, refactors, anything not
      # meant to ship) still runs the tests but skips every release step.
      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION file must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi
          if ! grep -qE "^ *MARKETING_VERSION: \"$VERSION\"$" project.yml; then
            echo "::error::project.yml's MARKETING_VERSION doesn't match VERSION ($VERSION) — use scripts/set_version.sh"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged — running tests only, no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Runs before "Run tests" too, not just the DMG build — with a real
      # DEVELOPMENT_TEAM set in project.yml (applies to every target),
      # even the test target now needs a valid signing certificate to build.
      - name: Import signing certificates
        env:
          DEVELOPER_CERTIFICATE_P12: ${{ secrets.DEVELOPER_CERTIFICATE_P12 }}
          DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/dev.p12"
          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/devid.p12"

          # Apple Development signs the archive step; Developer ID Application
          # re-signs during -exportArchive. Both need to land in this keychain.
          security import "$RUNNER_TEMP/dev.p12" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dev.p12" "$RUNNER_TEMP/devid.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to the search list rather than replacing it, so the runner's
          # own default keychains (and whatever they hold) stay reachable too.
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/"//g')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          xcodebuild \
            -project CorrectClick.xcodeproj \
            -scheme CorrectClickTests \
            -destination 'platform=macOS' \
            test

      - name: Build, notarize, and package DMG
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: ./scripts/build_dmg.sh

      - name: Download Sparkle tools
        if: steps.version.outputs.release == 'true'
        run: |
          # Pinned to the same version as project.yml's Sparkle SPM package —
          # keep these in sync.
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz" -o /tmp/Sparkle.tar.xz
          mkdir -p build/sparkle_tools
          tar -xJf /tmp/Sparkle.tar.xz -C build/sparkle_tools bin

      - name: Generate appcast entry
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/generate_appcast.sh

      - name: Commit appcast and tag
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/CorrectClick-${{ steps.version.outputs.version }}.dmg" \
            --title "CorrectClick v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
